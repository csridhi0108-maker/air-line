services:
  - type: web
    name: airline-dbms
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 worker: SQLite doesn't like many concurrent writers
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
